# In-memory database: recreated on every start (create-drop) and filled by DataInitializer.
spring.datasource.url=jdbc:h2:mem:prescriptions;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# The H2 console is disabled because it would bypass the API's security (see doc/seguridad.md to enable it locally).
spring.h2.console.enabled=false
