spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prescriptions}
spring.datasource.username=${DB_USER:dagss}
spring.datasource.password=${DB_PASSWORD:dagss}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update": adjusts the schema if needed, without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
