# The h2 profile is active by default; use -Dspring-boot.run.profiles=mysql for MySQL.
spring.profiles.active=h2

spring.application.name=prescriptions

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security (see doc/seguridad.md)
# Secret used to sign the access tokens (JWT, HS256): at least 32 characters.
# If it is not set, a random one is generated on every start (tokens do not survive a restart).
app.security.jwt-secret=${JWT_SECRET:}
# Lifetime of an access token, in minutes.
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:120}
# Origins allowed to call the API from a browser (comma separated; "*" = any, fine for local demos).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.doc-expansion=none
