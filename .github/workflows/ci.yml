name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar tests
        run: ./mvnw -B test
