<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recetario — Gestión de receta electrónica</title>
<style>
  :root {
    color-scheme: light dark;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --border: rgba(120,120,120,.28);
    --surface: rgba(120,120,120,.07);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; max-width: 960px; margin: 0 auto 3rem; padding: 0 1.25rem; line-height: 1.45; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 2.2rem; padding-bottom: .4rem; border-bottom: 1px solid var(--border); letter-spacing: .01em; }
  h2 .action { float: right; font-size: .8rem; }

  .app-header {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1rem;
    padding: 1.1rem 0; margin-bottom: 1.75rem; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; }
  .brand-badge {
    flex: 0 0 auto; width: 2.3rem; height: 2.3rem; border-radius: 9px; color: #fff;
    background: linear-gradient(135deg, var(--primary), #1e3a8a);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .95rem;
  }
  .brand-text { min-width: 0; }
  .brand-name-row { display: flex; align-items: baseline; gap: .5rem; }
  .brand-name { font-weight: 700; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-tagline { font-size: .78rem; opacity: .62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demo-badge { font-size: .62rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--primary); background: rgba(37,99,235,.12); padding: .12rem .45rem; border-radius: 999px; flex: 0 0 auto; }
  .header-controls { display: flex; align-items: center; gap: .7rem; justify-self: end; flex-wrap: wrap; }
  .user-chip { display: flex; align-items: center; gap: .5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: .25rem .3rem .25rem .85rem; font-size: .83rem; white-space: nowrap; }
  .role-badge { background: rgba(37,99,235,.14); color: var(--primary); padding: .15rem .5rem; border-radius: 999px; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .user-chip button { padding: .3rem .7rem; font-size: .78rem; border-radius: 999px; }
  @media (max-width: 640px) {
    .app-header { grid-template-columns: 1fr; }
    .header-controls { justify-self: start; }
  }

  .config { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; font-size: .8rem; opacity: .8; }
  .config label { display: flex; flex-direction: column; gap: .2rem; }
  .lang-switch { display: flex; gap: .2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: .2rem; }
  .lang-switch button { padding: .25rem .65rem; font-size: .75rem; border-radius: 999px; border: none; background: none; color: inherit; opacity: .55; }
  .lang-switch button.active { background: var(--primary); color: white; opacity: 1; }

  input, select, button { font: inherit; padding: .45rem .65rem; border-radius: 7px; border: 1px solid var(--border); }
  button { cursor: pointer; background: var(--primary); color: white; border: none; font-weight: 500; }
  button:hover { background: var(--primary-dark); }
  button.secondary { background: #64748b; }
  button.danger { background: #dc2626; }
  button.link { background: none; color: var(--primary); padding: 0; text-decoration: underline; font-weight: 400; }
  button:disabled { opacity: .5; cursor: default; }

  .tabs { display: flex; gap: .25rem; margin-bottom: 1.4rem; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .3rem; }
  .tabs button { background: none; color: inherit; opacity: .6; border-radius: 7px; font-size: .88rem; }
  .tabs button:hover { background: rgba(120,120,120,.12); opacity: 1; }
  .tabs button:not(.inactive) { background: var(--primary); color: #fff; opacity: 1; }

  table { width: 100%; border-collapse: collapse; margin: .6rem 0; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--border); }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; opacity: .6; font-weight: 600; }
  tbody tr:hover { background: rgba(120,120,120,.06); }

  .slots { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
  .slots button { background: #16a34a; }
  .slots button.selected-slot { background: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,.35); }
  .confirm-panel { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; background: rgba(37,99,235,.07); border: 1px solid rgba(37,99,235,.35); border-radius: 10px; padding: .75rem 1rem; margin: .6rem 0; font-size: .92rem; }
  .confirm-actions { display: flex; gap: .5rem; }
  .form-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-end; margin: .5rem 0; }
  .form-row label { display: flex; flex-direction: column; font-size: .8rem; gap: .25rem; opacity: .85; }
  .form-row label.wide { flex: 1; }
  .form-row input.wide { width: 100%; }
  .msg { padding: .6rem .8rem; border-radius: 8px; margin: .6rem 0; font-size: .9rem; }
  .msg.ok { background: #16a34a1f; border: 1px solid #16a34a55; }
  .msg.error { background: #dc26261f; border: 1px solid #dc262655; }
  tr.medication-result { cursor: pointer; }
  tr.medication-result:hover { background: rgba(120,120,120,.12); }
  tr.medication-result.selected { background: rgba(37,99,235,.16); }
  tr.fillable td:first-child { border-left: 3px solid #16a34a; }
  tr.not-fillable td:first-child { border-left: 3px solid #dc2626; }

  .directory { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; }
  .person-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem; color: inherit; transition: border-color .15s, transform .1s; }
  .person-card:hover { border-color: var(--primary); background: rgba(37,99,235,.07); }
  .person-card .name { font-weight: 600; }
  .person-card .detail { font-size: .8rem; opacity: .7; margin-top: .25rem; }

  .profile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 1rem; }
  .profile dl { display: grid; grid-template-columns: auto 1fr; gap: .35rem 1.2rem; margin: .6rem 0 0; font-size: .9rem; }
  .profile dt { opacity: .6; }
  .profile dd { margin: 0; }

  .create-form { background: rgba(37,99,235,.05); border: 1px solid rgba(37,99,235,.3); border-radius: var(--radius); padding: .9rem; margin: .9rem 0; }
  .create-form .form-row { margin: .4rem 0; }
  .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .7rem; margin-bottom: .7rem; }

  .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { max-width: 380px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: .6rem; margin-bottom: 1.6rem; text-align: center; }
  .login-brand .brand-badge { width: 3rem; height: 3rem; font-size: 1.2rem; }
  .login-brand h1 { margin: 0; font-size: 1.3rem; }
  .login-brand p { margin: 0; font-size: .85rem; opacity: .65; }
  .login-card form { display: flex; flex-direction: column; gap: .9rem; }
  .login-card label { display: flex; flex-direction: column; gap: .3rem; font-size: .82rem; opacity: .85; }
  .login-card input { width: 100%; }
  .login-card button[type="submit"] { padding: .6rem; font-size: .95rem; margin-top: .2rem; }
  .demo-note { margin-top: 1.5rem; font-size: .78rem; opacity: .75; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .7rem .8rem; line-height: 1.6; }
  .demo-note strong { opacity: .9; }
  .login-config { text-align: center; margin-bottom: 1rem; }

  input[aria-invalid="true"], select[aria-invalid="true"] { border-color: #dc2626; box-shadow: 0 0 0 1px #dc262655; }
  .date-wrap { position: relative; display: inline-flex; gap: .3rem; align-items: stretch; }
  .date-wrap input[type="text"] { width: 8.2rem; }
  .cal-btn { padding: .3rem .5rem; background: none; border: 1px solid var(--border); color: inherit; }
  .cal-btn:hover { background: rgba(120,120,120,.15); }
  .cal-hidden { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; padding: 0; border: 0; }
  .field-error { color: #dc2626; font-size: .72rem; line-height: 1.25; max-width: 20rem; }
  .info-note { font-size: .82rem; background: rgba(37,99,235,.08); border: 1px solid rgba(37,99,235,.3); border-radius: 8px; padding: .5rem .75rem; margin: .6rem 0; line-height: 1.45; }

function todayISO() { return localDateISO(); }

/**
 * Returns the function used for every request to the API. Once logged in, the access
 * token goes in the Authorization header; if the server answers 401 to an authenticated
 * request (token expired or no longer valid), onUnauthorized() sends the user back to the login.
 */
function useApi(apiBase, token, onUnauthorized) {
  return useCallback(async (method, path, body) => {
    const headers = {};
    if (body) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const resp = await fetch(apiBase.replace(/\/$/, '') + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    if (resp.status === 401 && token && onUnauthorized) onUnauthorized();
    if (resp.status === 204) return null;
    const text = await resp.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!resp.ok) throw new Error((data && data.message) || `HTTP error ${resp.status}`);
    return data;
  }, [apiBase, token, onUnauthorized]);
}

// These checks mirror the server-side rules (package es.uvigo.dagss.recetas.validation)
// and run before any request is sent; keep both in sync (doc/validaciones.md).

/** Spanish provinces; index + 1 is the province code (= first two digits of the postal code). */
const PROVINCES = [
  'Álava', 'Albacete', 'Alicante', 'Almería', 'Ávila', 'Badajoz', 'Illes Balears', 'Barcelona', 'Burgos', 'Cáceres',
  'Cádiz', 'Castellón', 'Ciudad Real', 'Córdoba', 'A Coruña', 'Cuenca', 'Girona', 'Granada', 'Guadalajara', 'Gipuzkoa',
  'Huelva', 'Huesca', 'Jaén', 'León', 'Lleida', 'La Rioja', 'Lugo', 'Madrid', 'Málaga', 'Murcia',
  'Navarra', 'Ourense', 'Asturias', 'Palencia', 'Las Palmas', 'Pontevedra', 'Salamanca', 'Santa Cruz de Tenerife', 'Cantabria', 'Segovia',
  'Sevilla', 'Soria', 'Tarragona', 'Teruel', 'Toledo', 'Valencia', 'Valladolid', 'Bizkaia', 'Zamora', 'Zaragoza',
  'Ceuta', 'Melilla',
];
const provinceCode = (name) => { const i = PROVINCES.indexOf(name); return i < 0 ? null : String(i + 1).padStart(2, '0'); };
const provinceFromPostalCode = (cp) => { const n = Number(cp.slice(0, 2)); return n >= 1 && n <= 52 ? PROVINCES[n - 1] : ''; };

/** A Date (local time) as YYYY-MM-DD. Not toISOString(): that one is UTC and near midnight gives another day. */
function dateToISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function localDateISO() { return dateToISO(new Date()); }

// Dates. The API always speaks ISO (YYYY-MM-DD); people see and type DD/MM/YYYY, whatever the browser's locale
// is (that is why there is no <input type="date">: its format cannot be chosen, it follows the browser).
/** YYYY-MM-DD (optionally followed by a time) -> DD/MM/YYYY; '' if it is not a date. */
function isoToDisplay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
}
/** YYYY-MM-DDTHH:mm... -> DD/MM/YYYY HH:mm. */
function isoToDisplayDateTime(iso) {
  const date = isoToDisplay(iso);
  return date ? `${date} ${String(iso).slice(11, 16)}` : '';
}
/** DD/MM/YYYY -> YYYY-MM-DD, or null if it is not a real calendar date (31/02/2025, 5/3/2025, 12/04/85...). */
function displayToIso(text) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(text || '');
  if (!m) return null;
  const day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
  const d = new Date(year, month - 1, day);
  return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day ? `${m[3]}-${m[2]}-${m[1]}` : null;
}
/** While typing: keeps the digits (max. 8) and puts the slashes in, so 28102026 becomes 28/10/2026. */
function maskDate(raw) {
  const d = String(raw).replace(/\D/g, '').slice(0, 8);
  if (d.length <= 2) return d;
  return d.length <= 4 ? `${d.slice(0, 2)}/${d.slice(2)}` : `${d.slice(0, 2)}/${d.slice(2, 4)}/${d.slice(4)}`;
}

const DNI_LETTERS = 'TRWAGMYFPDXBNJZSQVHLCKE';
function isValidDni(v) {
  const m = /^(\d{8})([A-Z])$/.exec(v);
  return !!m && DNI_LETTERS[Number(m[1]) % 23] === m[2];
}
function isValidNie(v) {
  const m = /^([XYZ])(\d{7})([A-Z])$/.exec(v);
  return !!m && DNI_LETTERS[Number('XYZ'.indexOf(m[1]) + m[2]) % 23] === m[3];
}

const maxLen = (n) => ({ msg: 'errMaxLength', arg: n, test: v => v.length <= n });

/** Rules by kind. `upper`: the value is upper-cased before testing (the server does the same). */
const RULES = {
  any: { msg: '', test: () => true },
  personName: { msg: 'errName', test: v => /^\p{L}[\p{L} .'’-]{1,59}$/u.test(v) },
  nationalId: { msg: 'errNationalId', upper: true, test: v => isValidDni(v) || isValidNie(v) },
  taxId: { msg: 'errTaxId', upper: true, test: v => isValidDni(v) || isValidNie(v) || /^[ABCDEFGHJNPQRSUVW]\d{7}[0-9A-J]$/.test(v) },
  healthCard: { msg: 'errHealthCard', upper: true, test: v => /^[A-Z]{4}\d{10}$/.test(v) },
  socialSecurity: { msg: 'errSocialSecurity', test: v => /^\d{12}$/.test(v) },
  license: { msg: 'errLicense', upper: true, test: v => /^[A-Z0-9][A-Z0-9-]{3,14}$/.test(v) },
  phone: { msg: 'errPhone', test: v => /^[6-9]\d{8}$/.test(v) },
  email: { msg: 'errEmail', test: v => v.length <= 100 && /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/.test(v) },
  username: { msg: 'errUsername', test: v => /^[A-Za-z0-9._-]{3,30}$/.test(v) },
  street: { msg: 'errStreet', test: v => v.length >= 3 && v.length <= 120 },
  city: { msg: 'errCity', test: v => /^\p{L}[\p{L} .'’/-]{1,59}$/u.test(v) },
  postalCode: { msg: 'errPostalCode', test: v => /^(0[1-9]|[1-4]\d|5[0-2])\d{3}$/.test(v) },
  province: { msg: 'errProvince', test: v => PROVINCES.includes(v) },
  birthDate: { msg: 'errBirthDate', test: v => { const iso = displayToIso(v); return !!iso && iso >= '1900-01-01' && iso <= localDateISO(); } },
  password: { msg: 'errPassword', test: v => v.length >= 4 && v.length <= 64 },
  units: { msg: 'errUnits', test: v => /^\d+$/.test(v) && Number(v) >= 1 && Number(v) <= 1000 },
  dose: { msg: 'errDose', test: v => Number(v) > 0 && Number(v) <= 100 },
  futureDate: { msg: 'errEndDate', test: v => { const iso = displayToIso(v); return !!iso && iso > localDateISO(); } },
  text80: maxLen(80), text100: maxLen(100), text120: maxLen(120), text255: maxLen(255),
};

/** One form field to check: `optional` fields are only checked when they are not empty. */
const f = (field, rule, label, optional = false) => ({ field, rule, label, optional });

/**
 * Checks `values` against `spec` and returns {field: message} (empty when all is fine).
 * Nothing may be left blank unless the field is `optional`.
 */
function validateForm(values, spec, t) {
  const errors = {};
  for (const { field, rule, label, optional } of spec) {
    let value = String(values[field] ?? '').trim();
    if (!value) {
      if (!optional) errors[field] = t('errRequired', t(label));
      continue;
    }
    const r = RULES[rule];
    if (r.upper) value = value.toUpperCase();
    if (!r.test(value)) errors[field] = r.arg !== undefined ? t(r.msg, r.arg) : t(r.msg);
  }
  // The postal code must belong to the selected province (36xxx -> Pontevedra).
  if (spec.some(x => x.field === 'postalCode') && !errors.postalCode && !errors.province) {
    const cp = String(values.postalCode ?? '').trim();
    const code = provinceCode(String(values.province ?? '').trim());
    if (cp && code && !cp.startsWith(code)) errors.postalCode = t('errPostalProvince', cp, values.province, code);
  }
  return errors;
}

const hasErrors = (errors) => Object.keys(errors).length > 0;

function Field({ label, name, values, onChange, type = 'text', wide, errors, maxDigits, ...rest }) {
  const error = errors ? errors[name] : undefined;
  const handleChange = (e) => {
    const raw = e.target.value;
    // `maxDigits`: digits-only field. Filtering here (instead of using maxLength) keeps a pasted "986 123 456" intact.
    onChange({ ...values, [name]: maxDigits ? raw.replace(/\D/g, '').slice(0, maxDigits) : raw });
  };
  return (
    <label className={wide ? 'wide' : ''}>
      {label}
      <input className={wide ? 'wide' : ''} type={type} value={values[name] ?? ''} onChange={handleChange}
             aria-invalid={error ? 'true' : undefined} {...rest} />
      {error && <span className="field-error" role="alert">{error}</span>}
    </label>
  );
}

/** Calendar button that opens the browser's calendar; the date picked comes back as ISO (the hidden native input is only a picker). */
function CalendarButton({ iso, onPick, min, max, t }) {
  const ref = useRef(null);
  const open = () => {
    const el = ref.current;
    if (!el) return;
    if (el.showPicker) { try { el.showPicker(); return; } catch (e) { /* falls back to focus */ } }
    el.focus();
  };
  return (
    <>
      <button type="button" className="cal-btn" title={t('openCalendar')} aria-label={t('openCalendar')} onClick={open}><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false" style={{ display: 'block' }}><rect x="2" y="3" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" strokeWidth="1.4" /><path d="M2 6.5h12M5 1.5v3M11 1.5v3" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" /></svg></button>
      <input ref={ref} type="date" className="cal-hidden" tabIndex={-1} aria-hidden="true" value={iso || ''} min={min} max={max}
             onChange={e => { if (e.target.value) onPick(e.target.value); }} />
    </>
  );
}

/** Form date field: the text DD/MM/YYYY is what is kept in the form values (and validated); convert with displayToIso to send it. */
function DateField({ label, name, values, onChange, errors, t, min, max }) {
  const error = errors ? errors[name] : undefined;
  return (
    <label>{label}
      <span className="date-wrap">
        <input type="text" inputMode="numeric" autoComplete="off" maxLength={10} placeholder={t('datePlaceholder')}
               value={values[name] ?? ''} aria-invalid={error ? 'true' : undefined}
               onChange={e => onChange({ ...values, [name]: maskDate(e.target.value) })} />
        <CalendarButton iso={displayToIso(values[name])} min={min} max={max} t={t}
                        onPick={iso => onChange({ ...values, [name]: isoToDisplay(iso) })} />
      </span>
      {error && <span className="field-error" role="alert">{error}</span>}
    </label>
  );
}

/**
 * Date filter (day of the agenda, day to book...): `value` is ISO and `onChange` only fires with a complete, real date.
 * While the text is incomplete it is shown as invalid, and on leaving the field it goes back to the last valid date.
 */
function DateInput({ value, onChange, t, min, max }) {
  const [text, setText] = useState(isoToDisplay(value));
  useEffect(() => { if (displayToIso(text) !== value) setText(isoToDisplay(value)); }, [value]); // eslint-disable-line
  const invalid = text !== '' && displayToIso(text) === null;
  const handle = (e) => {
    const next = maskDate(e.target.value);
    setText(next);
    const iso = displayToIso(next);
    if (iso) onChange(iso);
  };
  return (
    <span className="date-wrap">
      <input type="text" inputMode="numeric" autoComplete="off" maxLength={10} placeholder={t('datePlaceholder')}
             value={text} aria-invalid={invalid ? 'true' : undefined} onChange={handle}
             onBlur={() => setText(isoToDisplay(value))} />
      <CalendarButton iso={value} min={min} max={max} t={t} onPick={onChange} />
    </span>
  );
}

/** Phone: plain text input that only accepts digits (max. 9), instead of a number spinner. */
function PhoneField(props) {
  return <Field type="tel" inputMode="numeric" maxDigits={9} autoComplete="tel" placeholder="986123456" {...props} />;
}

/** Postal code: digits only (max. 5); suggests the matching province while the user types. */
function PostalCodeField({ label, values, onChange, errors }) {
  const handleChange = (next) => {
    const cp = next.postalCode || '';
    const guess = cp.length >= 2 ? provinceFromPostalCode(cp) : '';
    // Only fill the province if it is empty or was itself filled automatically (never overwrite a manual choice).
    if (guess && (!values.province || values._provinceAuto)) next = { ...next, province: guess, _provinceAuto: true };
    onChange(next);
  };
  return <Field label={label} name="postalCode" values={values} onChange={handleChange} errors={errors}
                inputMode="numeric" maxDigits={5} autoComplete="postal-code" placeholder="36201" />;
}

/** Province: a list with the 52 real provinces, so a made-up one cannot even be typed. */
function ProvinceSelect({ label, values, onChange, errors, t }) {
  const error = errors ? errors.province : undefined;
  return (
    <label>{label}
      <select value={values.province ?? ''} aria-invalid={error ? 'true' : undefined}
              onChange={e => onChange({ ...values, province: e.target.value, _provinceAuto: false })}>
        <option value="">{t('selectProvince')}</option>
        {PROVINCES.map(p => <option key={p} value={p}>{p}</option>)}
      </select>
      {error && <span className="field-error" role="alert">{error}</span>}
    </label>
  );
}

/** Error line for inputs that are not a Field (e.g. a <select>). */
function FieldError({ errors, name }) {
  return errors && errors[name] ? <span className="field-error" role="alert">{errors[name]}</span> : null;
}

function InfoNote({ children }) {

function PasswordChangeForm({ apiCall, endpoint, t }) {
  const [v, setV] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [notice, notify] = useNotice();
  const errors = submitted ? validateForm(v, PASSWORD_CHANGE_SPEC, t) : {};

  const submit = async () => {
    setSubmitted(true);
    if (hasErrors(validateForm(v, PASSWORD_CHANGE_SPEC, t))) { notify(t('fixErrors'), true); return; }
    try {
      await apiCall('PATCH', endpoint, { currentPassword: v.currentPassword, newPassword: v.newPassword });
      notify(t('passwordChanged'));
      setV({});
      setSubmitted(false);
    } catch (e) { notify(e.message, true); }
  };

  return (
    <div>
      <div className="form-row">
        <Field label={t('currentPassword')} name="currentPassword" values={v} onChange={setV} type="password" errors={errors} />
        <Field label={t('newPassword')} name="newPassword" values={v} onChange={setV} type="password" errors={errors} />
        <button onClick={submit}>{t('changePassword')}</button>
      </div>
      <Notice {...notice} />
    </div>
  );
}

  return (

function PharmaciesTab({ apiCall, t }) {
  const [pharmacies, setPharmacies] = useState([]);
  const [creating, setCreating] = useState(false);
  const [v, setV] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [filters, setFilters] = useState({});
  const [notice, notify] = useNotice();
  const [selectedId, setSelectedId] = useState(null);
  const errors = submitted ? validateForm(v, PHARMACY_SPEC, t) : {};
  const taxId = (v.taxId || '').trim().toUpperCase();
  const pharmacistLicense = (v.pharmacistLicenseNumber || '').trim().toUpperCase();

  const load = useCallback(async () => {
    try {
      let path = '/pharmacies';
      if (filters.name) path += `?name=${encodeURIComponent(filters.name)}`;
      setPharmacies(await apiCall('GET', path));
    } catch (e) { notify(e.message, true); }
  }, [apiCall, filters]);

  useEffect(() => { load(); }, [load]);

  const save = async () => {
    setSubmitted(true);
    if (hasErrors(validateForm(v, PHARMACY_SPEC, t))) { notify(t('fixErrors'), true); return; }
    try {
      await apiCall('POST', '/pharmacies', {
        name: v.name.trim(), pharmacistFirstName: v.pharmacistFirstName.trim(), pharmacistLastName: v.pharmacistLastName.trim(),
        taxId, pharmacistLicenseNumber: pharmacistLicense,
        address: { street: v.street.trim(), city: v.city.trim(), postalCode: v.postalCode.trim(), province: v.province },
        phone: v.phone.trim(), email: v.email.trim(), username: (v.username || '').trim() || taxId,
      });
      setCreating(false); setSubmitted(false); setV({}); load();
    } catch (e) { notify(e.message, true); }
  };

  const deactivate = async (id) => {
    try { await apiCall('DELETE', `/pharmacies/${id}`); setSelectedId(null); load(); }
    catch (e) { notify(e.message, true); }
  };

  const active = pharmacies.filter(f => f.active);
  const pharmacy = active.find(f => f.id === selectedId);
  if (pharmacy) {
    return (
      <section>
        <BackButton onClick={() => setSelectedId(null)}>{t('backToPharmacies')}</BackButton>
        <div className="profile">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div className="name" style={{ fontSize: '1.15rem' }}>{pharmacy.name}</div>
            <DeactivateButton name={pharmacy.name} t={t} onConfirm={() => deactivate(pharmacy.id)} />
          </div>
          <dl>
            <dt>{t('pharmacist')}</dt><dd>{pharmacy.pharmacistFirstName} {pharmacy.pharmacistLastName}</dd>
            <dt>{t('taxId')}</dt><dd>{pharmacy.taxId || '—'}</dd>
            <dt>{t('licenseNumber')}</dt><dd>{pharmacy.pharmacistLicenseNumber || '—'}</dd>
            <dt>{t('street')}</dt><dd>{pharmacy.address?.street || '—'}</dd>
            <dt>{t('city')}</dt><dd>{pharmacy.address?.city || '—'}</dd>
            <dt>{t('postalCode')}</dt><dd>{pharmacy.address?.postalCode || '—'}</dd>
            <dt>{t('province')}</dt><dd>{pharmacy.address?.province || '—'}</dd>
            <dt>{t('phone')}</dt><dd>{pharmacy.phone || '—'}</dd>
            <dt>{t('email')}</dt><dd>{pharmacy.email || '—'}</dd>
            <dt>{t('username')}</dt><dd>{pharmacy.username || '—'}</dd>
          </dl>
        </div>
      </section>
    );
  }

  return (
    <section>
      <h2>{t('pharmacies')} <span className="action"><button onClick={() => setCreating(c => !c)}>{creating ? t('cancel') : t('newPharmacy')}</button></span></h2>
      <div className="filter-bar form-row">
        <Field label={t('filterByName')} name="name" values={filters} onChange={setFilters} />
        <button onClick={load}>{t('applyFilters')}</button>
        <button className="secondary" onClick={() => setFilters({})}>{t('clearFilters')}</button>
      </div>
      {creating && (
        <div className="create-form">
          <div className="form-row">
            <Field label={t('establishmentName')} name="name" values={v} onChange={setV} errors={errors} wide />
          </div>
          <div className="form-row">
            <Field label={t('pharmacistFirstName')} name="pharmacistFirstName" values={v} onChange={setV} errors={errors} />
            <Field label={t('pharmacistLastName')} name="pharmacistLastName" values={v} onChange={setV} errors={errors} />
            <Field label={t('taxId')} name="taxId" values={v} onChange={setV} errors={errors} maxLength={9} placeholder="12345678Z" />
            <Field label={t('licenseNumber')} name="pharmacistLicenseNumber" values={v} onChange={setV} errors={errors} maxLength={15} placeholder="PLIC-778899" />
          </div>
          <div className="form-row">
            <Field label={t('street')} name="street" values={v} onChange={setV} errors={errors} wide />
          </div>
          <div className="form-row">
            <Field label={t('city')} name="city" values={v} onChange={setV} errors={errors} />
            <PostalCodeField label={t('postalCode')} values={v} onChange={setV} errors={errors} />
            <ProvinceSelect label={t('province')} values={v} onChange={setV} errors={errors} t={t} />
            <PhoneField label={t('phone')} name="phone" values={v} onChange={setV} errors={errors} />

          </div>
          <div className="form-row">
            <Field label={t('username')} name="username" values={v} onChange={setV} errors={errors} placeholder={taxId} />
          </div>
          <InfoNote>{t('pharmacyPasswordNote', pharmacistLicense)}</InfoNote>

        </div>
      )}
      <table><tbody>
        <tr><th>{t('name')}</th><th>{t('pharmacist')}</th><th>{t('city')}</th><th></th></tr>
        {active.map(f => (
          <tr key={f.id}>
            <td>{f.name}</td><td>{f.pharmacistFirstName} {f.pharmacistLastName}</td><td>{f.address?.city}</td>
            <td>

function AdministratorHome({ apiCall, t }) {
  const [tab, setTab] = useState('administrators');
  const [patients, setPatients] = useState([]);
  const [doctors, setDoctors] = useState([]);
  const [centers, setCenters] = useState([]);
  const [selectedPatientId, setSelectedPatientId] = useState(null);
  const [selectedDoctorId, setSelectedDoctorId] = useState(null);
  const [patientFilters, setPatientFilters] = useState({});
  const [doctorFilters, setDoctorFilters] = useState({});
  const [notice, notify] = useNotice();

  const loadDirectories = useCallback(async () => {
    try {
      const [ps, ds, cs] = await Promise.all([apiCall('GET', '/patients'), apiCall('GET', '/doctors'), apiCall('GET', '/health-centers')]);
      setPatients(ps); setDoctors(ds); setCenters(cs);
    } catch (e) { notify(e.message, true); }
  }, [apiCall]);

  useEffect(() => { loadDirectories(); }, [loadDirectories]);

  const activePatients = patients.filter(p => p.active).filter(p =>
    (!patientFilters.name || p.name.toLowerCase().includes(patientFilters.name.toLowerCase())) &&
    (!patientFilters.healthCenterId || (p.healthCenter && String(p.healthCenter.id) === String(patientFilters.healthCenterId))) &&
    (!patientFilters.doctorId || (p.doctor && String(p.doctor.id) === String(patientFilters.doctorId))));
  const activeDoctors = doctors.filter(d => d.active).filter(d =>
    (!doctorFilters.name || d.name.toLowerCase().includes(doctorFilters.name.toLowerCase())) &&
    (!doctorFilters.healthCenterId || (d.healthCenter && String(d.healthCenter.id) === String(doctorFilters.healthCenterId))));
  const activeCenters = centers.filter(c => c.active);

  const selectedPatient = patients.find(p => p.id === selectedPatientId);
  const selectedDoctor = doctors.find(d => d.id === selectedDoctorId);
  const doctorPatients = selectedDoctor ? patients.filter(p => p.active && p.doctor && p.doctor.id === selectedDoctor.id) : [];

  const tabs = [
    ['administrators', t('tabAdministrators')],
    ['centers', t('tabCenters')],
    ['doctors', t('tabDoctors')],
    ['patients', t('tabPatients')],
    ['pharmacies', t('tabPharmacies')],
    ['appointments', t('tabAppointments')],
    ['medications', t('tabMedications')],
  ];

  return (
    <div>
      <div className="tabs">
        {tabs.map(([id, label]) => (
          <button key={id} className={tab === id ? '' : 'inactive'}
                  onClick={() => { setTab(id); setSelectedPatientId(null); setSelectedDoctorId(null); }}>{label}</button>
        ))}
      </div>
      <Notice {...notice} />

      {tab === 'administrators' && <AdministratorsTab apiCall={apiCall} t={t} />}
      {tab === 'centers' && <CentersTab apiCall={apiCall} t={t} />}

      {tab === 'doctors' && (
        selectedDoctor
          ? <AdminDoctorDetail doctor={selectedDoctor} apiCall={apiCall} t={t}
              onBack={() => setSelectedDoctorId(null)} onDeactivated={() => { setSelectedDoctorId(null); loadDirectories(); }} />
          : <DoctorDirectory doctors={activeDoctors} centers={activeCenters} filters={doctorFilters} setFilters={setDoctorFilters}
              onSelect={setSelectedDoctorId} apiCall={apiCall} onChanged={loadDirectories} t={t} />
      )}

      {tab === 'patients' && (
        selectedPatient
          ? <AdminPatientDetail patient={selectedPatient} apiCall={apiCall} t={t}
              onBack={() => setSelectedPatientId(null)} onDeactivated={() => { setSelectedPatientId(null); loadDirectories(); }} />
          : <PatientDirectory patients={activePatients} centers={activeCenters} doctors={activeDoctors} filters={patientFilters} setFilters={setPatientFilters}
              onSelect={setSelectedPatientId} apiCall={apiCall} onChanged={loadDirectories} t={t} />
      )}

      {tab === 'pharmacies' && <PharmaciesTab apiCall={apiCall} t={t} />}
      {tab === 'appointments' && <AppointmentsAdminTab doctors={activeDoctors} patients={activePatients} apiCall={apiCall} t={t} />}
      {tab === 'medications' && <MedicationsTab apiCall={apiCall} t={t} />}
    </div>
  );
}

function DoctorHome({ session, apiCall, t }) {
  const [view, setView] = useState('schedule'); // 'schedule' | 'attend' | 'profile'
  const [doctor, setDoctor] = useState(null);
  const [scheduleDay, setScheduleDay] = useState(todayISO());
  const [schedule, setSchedule] = useState([]);
  const [attending, setAttending] = useState(null);
  const [notice, notify] = useNotice();

  const loadDoctor = useCallback(async () => {
    try { setDoctor(await apiCall('GET', `/doctors/${session.id}`)); }
    catch (e) { notify(e.message, true); }
  }, [apiCall, session.id]);

  const loadSchedule = useCallback(async () => {
    try { setSchedule(await apiCall('GET', `/doctors/${session.id}/schedule?day=${scheduleDay}`)); }
    catch (e) { notify(e.message, true); }
  }, [apiCall, session.id, scheduleDay]);

  useEffect(() => { loadDoctor(); }, [loadDoctor]);
  useEffect(() => { if (view === 'schedule') loadSchedule(); }, [view, loadSchedule]);

  const updateAppointment = async (id, action) => {
    try { await apiCall('POST', `/appointments/${id}/${action}`); loadSchedule(); }
    catch (e) { notify(e.message, true); }
  };

  if (!doctor) return <Notice {...notice} />;

  return (
    <div>
      <div className="tabs">
        <button className={view === 'schedule' || view === 'attend' ? '' : 'inactive'} onClick={() => setView('schedule')}>{t('mySchedule')}</button>
        <button className={view === 'profile' ? '' : 'inactive'} onClick={() => setView('profile')}>{t('myProfile')}</button>
      </div>
      <Notice {...notice} />

      {view === 'schedule' && (
        <section>
          <h2>{t('mySchedule')}</h2>
          <div className="form-row">
            <label>{t('day')} <DateInput value={scheduleDay} onChange={setScheduleDay} t={t} /></label>
            <button onClick={loadSchedule}>{t('viewSchedule')}</button>
          </div>
          {schedule.length === 0 ? <p><em>{t('noAppointmentsThatDay')}</em></p> : (
            <table><tbody>
              <tr><th>{t('patientCol')}</th><th>{t('dateTimeCol')}</th><th>{t('statusCol')}</th><th></th></tr>
              {schedule.map(a => (
                <tr key={a.id}>
                  <td>{a.patientName}</td><td>{a.dateTime.slice(11, 16)}</td><td>{a.status}</td>
                  <td>{a.status === 'SCHEDULED' && <>
                    <button onClick={() => { setAttending(a); setView('attend'); }}>{t('attend')}</button>{' '}
                    <button className="secondary" onClick={() => updateAppointment(a.id, 'no-show')}>{t('noShow')}</button>
                  </>}</td>
                </tr>
              ))}
            </tbody></table>
          )}
        </section>
      )}

      {view === 'attend' && attending && (
        <AppointmentAttention appointment={attending} doctor={doctor} apiCall={apiCall} t={t}
          onBack={() => { setAttending(null); setView('schedule'); }}
          onCompleted={() => { setAttending(null); setView('schedule'); }} />
      )}

      {view === 'profile' && <DoctorProfileEditor doctor={doctor} apiCall={apiCall} t={t} onSaved={loadDoctor} />}
    </div>
  );
}

function AppointmentAttention({ appointment, doctor, apiCall, onBack, onCompleted, t }) {
  const [patient, setPatient] = useState(null);
  const [prescriptions, setPrescriptions] = useState([]);
  const [creatingRx, setCreatingRx] = useState(false);
  const [notice, notify] = useNotice();

  const load = useCallback(async () => {
    try {
      const [p, rx] = await Promise.all([
        apiCall('GET', `/patients/${appointment.patientId}`),
        apiCall('GET', `/patients/${appointment.patientId}/prescriptions`),
      ]);
      setPatient(p); setPrescriptions(rx);
    } catch (e) { notify(e.message, true); }
  }, [apiCall, appointment.patientId]);

  useEffect(() => { load(); }, [load]);

  const cancelPrescription = async (id) => {
    try { await apiCall('POST', `/prescriptions/${id}/cancel`); load(); }
    catch (e) { notify(e.message, true); }
  };

  const completeVisit = async () => {
    try { await apiCall('POST', `/appointments/${appointment.id}/complete`); onCompleted(); }
    catch (e) { notify(e.message, true); }
  };

  if (!patient) return <Notice {...notice} />;

  return (
    <section>
      <BackButton onClick={onBack}>{t('backToSchedule')}</BackButton>
      <h2>{t('appointmentAttention')}</h2>

      <div className="profile">
        <div className="name" style={{ fontSize: '1.15rem' }}>{patient.name} {patient.lastName}</div>
        <dl>
          <dt>{t('birthDate')}</dt><dd>{isoToDisplay(patient.birthDate) || '—'}</dd>
          <dt>{t('street')}</dt><dd>{patient.address ? `${patient.address.street}, ${patient.address.city}` : '—'}</dd>
        </dl>
      </div>

      <h2>{t('activePrescriptions')}</h2>
      {prescriptions.length === 0 ? <p><em>{t('noActivePrescriptions')}</em></p> : (
        <table><tbody>
          <tr><th>{t('medicationCol')}</th><th>{t('doseCol')}</th><th>{t('periodCol')}</th><th></th></tr>
          {prescriptions.map(rx => (
            <tr key={rx.id}>
              <td>{rx.medicationBrandName}</td><td>{rx.dailyDose}</td>
              <td>{isoToDisplay(rx.startDate)} → {isoToDisplay(rx.endDate)}</td>
              <td><button className="danger" onClick={() => cancelPrescription(rx.id)}>{t('cancelPrescription')}</button></td>
            </tr>
          ))}
        </tbody></table>
      )}

      <h2>{t('createPrescription')} <span className="action"><button onClick={() => setCreatingRx(c => !c)}>{creatingRx ? t('cancel') : t('newPrescriptionBtn')}</button></span></h2>
      {creatingRx && (
        <NewPrescriptionForm patientId={patient.id} doctorId={doctor.id} apiCall={apiCall} t={t}
          onCreated={() => { setCreatingRx(false); load(); }} />
      )}

      <div className="form-row">
        <button onClick={completeVisit}>{t('completeAppointment')}</button>
      </div>

      <Notice {...notice} />
    </section>
  );
}

function NewPrescriptionForm({ patientId, doctorId, apiCall, onCreated, t }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [selectedMedication, setSelectedMedication] = useState(null);
  const [dose, setDose] = useState('2');
  const [instructions, setInstructions] = useState('');
  const [endDate, setEndDate] = useState(isoToDisplay(monthsFromNowISO(2))); // DD/MM/YYYY
  const [plan, setPlan] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [notice, notify] = useNotice();
  const prescriptionValues = { dose, endDate, instructions };
  const errors = submitted ? validateForm(prescriptionValues, PRESCRIPTION_SPEC, t) : {};

  const searchMedications = async () => {
    try { setResults(await apiCall('GET', `/medications?brandName=${encodeURIComponent(query)}`)); }
    catch (e) { notify(e.message, true); }
  };

  const create = async () => {
    if (!selectedMedication) { notify(t('selectMedicationFirst'), true); return; }
    setSubmitted(true);
    if (hasErrors(validateForm(prescriptionValues, PRESCRIPTION_SPEC, t))) { notify(t('fixErrors'), true); return; }
    try {
      const prescription = await apiCall('POST', '/prescriptions', {
        patientId, doctorId, medicationId: selectedMedication.id, dailyDose: Number(dose),
        instructions: instructions.trim(), endDate: displayToIso(endDate),
      });
      setPlan(prescription.refills);
      notify(t('planCreated'));
      onCreated();
    } catch (e) { notify(e.message, true); }
  };

  return (
    <div className="create-form">
      <div className="form-row">
        <label className="wide">{t('searchMedication')}
          <input className="wide" value={query} placeholder="e.g. Ibuprofen" onChange={e => setQuery(e.target.value)} />
        </label>
        <button onClick={searchMedications}>{t('search')}</button>
      </div>
      {results.length > 0 && (
        <table><tbody>
          <tr><th>{t('brandName')}</th><th>{t('activeIngredient')}</th><th>{t('manufacturer')}</th></tr>
          {results.map(m => (
            <tr key={m.id} className={`medication-result ${selectedMedication?.id === m.id ? 'selected' : ''}`}
                onClick={() => setSelectedMedication(m)}>
              <td>{m.brandName}</td><td>{m.activeIngredient}</td><td>{m.manufacturer}</td>
            </tr>
          ))}
        </tbody></table>
      )}
      <div className="form-row">
        <label>{t('selectedMedication')} <input readOnly value={selectedMedication ? selectedMedication.brandName : ''} /></label>
        <label>{t('dailyDose')} <input type="number" step="0.5" min="0.5" max="100" value={dose} onChange={e => setDose(e.target.value)} size="4"
                                        aria-invalid={errors.dose ? 'true' : undefined} /><FieldError errors={errors} name="dose" /></label>
        <DateField label={t('endDate')} name="endDate" values={prescriptionValues} onChange={nv => setEndDate(nv.endDate)}
                   errors={errors} t={t} />
      </div>
      <div className="form-row">
        <label className="wide">{t('instructions')}
          <input className="wide" value={instructions} placeholder={t('instructionsPlaceholder')} maxLength={255} onChange={e => setInstructions(e.target.value)}
                 aria-invalid={errors.instructions ? 'true' : undefined} />
          <FieldError errors={errors} name="instructions" />
        </label>
      </div>
      <button onClick={create} disabled={!selectedMedication}>{t('createPrescriptionAndPlan')}</button>
      {plan && (
        <table><tbody>
          <tr><th>{t('validFromCol')}</th><th>{t('validUntilCol')}</th><th>{t('boxesCol')}</th><th>{t('statusCol')}</th></tr>
          {plan.map(r => <tr key={r.id}><td>{isoToDisplay(r.validFrom)}</td><td>{isoToDisplay(r.validUntil)}</td><td>{r.boxes}</td><td>{r.status}</td></tr>)}
        </tbody></table>
      )}
      <Notice {...notice} />
    </div>
  );
}

function PatientHome({ session, apiCall, t }) {
  const [view, setView] = useState('appointments');
  const [patient, setPatient] = useState(null);
  const [appointments, setAppointments] = useState([]);
  const [day, setDay] = useState(todayISO());
  const [slots, setSlots] = useState(null);
  const [pendingSlot, setPendingSlot] = useState(null); // slot awaiting inline confirmation
  const [refills, setRefills] = useState([]);
  const [notice, notify] = useNotice();

  const loadPatient = useCallback(async () => {
    try { setPatient(await apiCall('GET', `/patients/${session.id}`)); }
    catch (e) { notify(e.message, true); }
  }, [apiCall, session.id]);

  const loadAppointments = useCallback(async () => {
    try { setAppointments(await apiCall('GET', `/patients/${session.id}/appointments`)); }
    catch (e) { notify(e.message, true); }
  }, [apiCall, session.id]);

  const loadRefills = useCallback(async () => {
    try { setRefills(await apiCall('GET', `/patients/${session.id}/refills`)); }
    catch (e) { notify(e.message, true); }
  }, [apiCall, session.id]);

  useEffect(() => { loadPatient(); loadAppointments(); loadRefills(); }, [loadPatient, loadAppointments, loadRefills]);

  const viewSlots = async () => {
    setPendingSlot(null);
    try { setSlots(await apiCall('GET', `/patients/${session.id}/available-slots?day=${day}`)); }
    catch (e) { notify(e.message, true); }
  };

  // The patient first picks a slot, then confirms it in an inline panel (no browser pop-up);
  // only then is the appointment created.
  const confirmBooking = async () => {
    const dateTime = pendingSlot;
    try {
      await apiCall('POST', '/appointments', { patientId: session.id, dateTime });
      notify(t('appointmentConfirmed', dateTime.slice(11, 16)));
      setPendingSlot(null);
      viewSlots(); loadAppointments();
    } catch (e) { notify(e.message, true); }
  };

  const cancelAppointment = async (id) => {
    try { await apiCall('POST', `/appointments/${id}/cancel`); loadAppointments(); }
    catch (e) { notify(e.message, true); }
  };

  if (!patient) return <Notice {...notice} />;

  return (
    <div>
      <div className="tabs">
        <button className={view === 'appointments' ? '' : 'inactive'} onClick={() => setView('appointments')}>{t('myAppointments')}</button>
        <button className={view === 'refills' ? '' : 'inactive'} onClick={() => setView('refills')}>{t('myPendingRefills')}</button>
        <button className={view === 'profile' ? '' : 'inactive'} onClick={() => setView('profile')}>{t('myProfile')}</button>
      </div>
      <Notice {...notice} />

      {view === 'appointments' && (
        <section>
          <h2>{t('myAppointments')}</h2>
          {appointments.length === 0 ? <em>{t('noAppointments')}</em> : (
            <table><tbody>
              <tr><th>{t('doctorCol')}</th><th>{t('dateTimeCol')}</th><th>{t('statusCol')}</th><th></th></tr>
              {appointments.map(a => (
                <tr key={a.id}>
                  <td>{a.doctorName}</td><td>{isoToDisplayDateTime(a.dateTime)}</td><td>{a.status}</td>
                  <td>{a.status === 'SCHEDULED' && <button className="danger" onClick={() => cancelAppointment(a.id)}>{t('cancelAppointment')}</button>}</td>
                </tr>
              ))}
            </tbody></table>
          )}

          <h2>{t('bookAppointment')}</h2>
          <div className="form-row">
            <label>{t('day')} <DateInput value={day} onChange={setDay} t={t} /></label>
            <button onClick={viewSlots}>{t('viewAvailableSlots')}</button>
          </div>
          <div className="slots">
            {slots === null ? null : slots.length === 0
              ? <em>{t('noSlotsAvailable')}</em>
              : slots.map(s => (
                <button key={s.start} className={pendingSlot === s.start ? 'selected-slot' : ''}
                        onClick={() => setPendingSlot(s.start)}>{s.start.slice(11, 16)}</button>
              ))}
          </div>
          {pendingSlot && (
            <div className="confirm-panel">
              <span>{t('confirmBooking', pendingSlot.slice(11, 16), isoToDisplay(pendingSlot))}</span>
              <div className="confirm-actions">
                <button onClick={confirmBooking}>{t('confirmBookingBtn')}</button>
                <button className="secondary" onClick={() => setPendingSlot(null)}>{t('cancel')}</button>
              </div>
            </div>
          )}
        </section>
      )}

      {view === 'refills' && (
        <section>
          <h2>{t('myPendingRefills')}</h2>
          {refills.length === 0 ? <p><em>{t('noPendingRefills')}</em></p> : (
            <table><tbody>
              <tr><th>{t('medicationCol')}</th><th>{t('activeIngredient')}</th><th>{t('manufacturer')}</th><th>{t('doctorCol')}</th><th>{t('validityCol')}</th><th>{t('boxesCol')}</th></tr>
              {refills.map(r => (
                <tr key={r.id}>
                  <td>{r.medicationBrandName}</td><td>{r.medicationActiveIngredient}</td><td>{r.medicationManufacturer}</td>
                  <td>{r.doctorName}</td><td>{isoToDisplay(r.validFrom)} → {isoToDisplay(r.validUntil)}</td><td>{r.boxes}</td>
                </tr>
              ))}
            </tbody></table>
          )}
        </section>
      )}

      {view === 'profile' && <PatientProfileEditor patient={patient} apiCall={apiCall} t={t} onSaved={loadPatient} />}
    </div>
  );
}

function PharmacyHome({ session, apiCall, t }) {
  const [view, setView] = useState('lookup');
  const [pharmacy, setPharmacy] = useState(null);
  const [cardNumber, setCardNumber] = useState('');
  const [cardError, setCardError] = useState('');
  const [refills, setRefills] = useState(null);
  const [notice, notify] = useNotice();

  const loadPharmacy = useCallback(async () => {
    try { setPharmacy(await apiCall('GET', `/pharmacies/${session.id}`)); }
    catch (e) { notify(e.message, true); }
  }, [apiCall, session.id]);

  useEffect(() => { loadPharmacy(); }, [loadPharmacy]);

  const search = async () => {
    const card = cardNumber.trim().toUpperCase();
    if (!card) { setCardError(t('errRequired', t('lookupByCard'))); return; }
    if (!RULES.healthCard.test(card)) { setCardError(t('errHealthCard')); return; }
    setCardError('');
    try { setRefills(await apiCall('GET', `/refills?healthCardNumber=${encodeURIComponent(card)}`)); }
    catch (e) { notify(e.message, true); }
  };

  const fill = async (id) => {
    try {
      await apiCall('POST', `/refills/${id}/fill?pharmacyId=${session.id}`);
      notify(t('refillFilled'));
      search();
    } catch (e) { notify(e.message, true); }
  };

  const today = todayISO();

  if (!pharmacy) return <Notice {...notice} />;

  return (
    <div>
      <div className="tabs">
        <button className={view === 'lookup' ? '' : 'inactive'} onClick={() => setView('lookup')}>{t('pharmacyLookup')}</button>
        <button className={view === 'profile' ? '' : 'inactive'} onClick={() => setView('profile')}>{t('myProfile')}</button>
      </div>
      <Notice {...notice} />

      {view === 'lookup' && (
        <section>
          <h2>{t('pharmacyLookup')}</h2>
          <div className="form-row">
            <Field label={t('lookupByCard')} name="cardNumber" values={{ cardNumber }} onChange={v => setCardNumber(v.cardNumber)}
                   errors={{ cardNumber: cardError }} maxLength={14} placeholder="ABCD1234567890" />
            <button onClick={search}>{t('searchByCard')}</button>
          </div>
          {refills !== null && (refills.length === 0 ? <p><em>{t('noRefillsFound')}</em></p> : (
            <table><tbody>
              <tr><th>{t('medicationCol')}</th><th>{t('activeIngredient')}</th><th>{t('manufacturer')}</th><th>{t('doctorCol')}</th><th>{t('validityCol')}</th><th>{t('boxesCol')}</th><th></th></tr>
              {refills.map(r => {
                const fillable = today >= r.validFrom && today <= r.validUntil;
                return (
                  <tr key={r.id} className={fillable ? 'fillable' : 'not-fillable'}>
                    <td>{r.medicationBrandName}</td><td>{r.medicationActiveIngredient}</td><td>{r.medicationManufacturer}</td>
                    <td>{r.doctorName}</td><td>{isoToDisplay(r.validFrom)} → {isoToDisplay(r.validUntil)}</td><td>{r.boxes}</td>
                    <td>
                      {fillable
                        ? <button onClick={() => fill(r.id)}>{t('markAsFilled')}</button>
                        : <em>{t('notFillableYet')}</em>}
                    </td>
                  </tr>
                );
              })}
            </tbody></table>
          ))}
        </section>
      )}

      {view === 'profile' && <PharmacyProfileEditor pharmacy={pharmacy} apiCall={apiCall} t={t} onSaved={loadPharmacy} />}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState('es');
  const t = useI18n(lang);
  const [apiBase, setApiBase] = useState('http://localhost:8080/api');
  const [session, setSession] = useState(null); // {id, role, name, lastName, token, expiresAt}; kept in memory only
  const [sessionExpired, setSessionExpired] = useState(false);
  const handleUnauthorized = useCallback(() => { setSession(null); setSessionExpired(true); }, []);
  const apiCall = useApi(apiBase, session ? session.token : null, handleUnauthorized);

  if (!session) {
    return <LoginScreen apiBase={apiBase} setApiBase={setApiBase} apiCall={apiCall}
             onLoggedIn={(s) => { setSessionExpired(false); setSession(s); }}
             sessionExpired={sessionExpired} lang={lang} setLang={setLang} t={t} />;
  }

  const displayName = session.lastName ? `${session.name} ${session.lastName}` : session.name;
  const roleLabel = ROLE_LABELS[lang][session.role];

  return (
    <div>
      <header className="app-header">
        <div className="brand">
          <div className="brand-badge">Rx</div>
          <div className="brand-text">
            <div className="brand-name-row">
              <span className="brand-name">{APP_NAME}</span>
              <span className="demo-badge">DEMO</span>
            </div>
            <div className="brand-tagline">{t('subtitle')}</div>
          </div>
        </div>
        <div className="header-controls">
          <LanguageSwitcher lang={lang} onChange={setLang} />
          <div className="user-chip">
            <span>{displayName}</span>
            <span className="role-badge">{roleLabel}</span>
            <button className="secondary" onClick={() => { setSessionExpired(false); setSession(null); }}>{t('logout')}</button>
          </div>
        </div>
      </header>

      {session.role === 'ADMINISTRATOR' && <AdministratorHome apiCall={apiCall} t={t} />}
      {session.role === 'DOCTOR' && <DoctorHome session={session} apiCall={apiCall} t={t} />}
      {session.role === 'PATIENT' && <PatientHome session={session} apiCall={apiCall} t={t} />}
      {session.role === 'PHARMACY' && <PharmacyHome session={session} apiCall={apiCall} t={t} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
