services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: recetas
      MYSQL_USER: dagss
      MYSQL_PASSWORD: dagss
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - recetas-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: recetas
      DB_USER: dagss
      DB_PASSWORD: dagss
      # Secret to sign the access tokens (>= 32 characters). Set it in your shell or in a .env file:
      #   JWT_SECRET=$(openssl rand -hex 32) docker compose up
      # If empty, a random one is generated on each start (sessions are lost on restart).
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  recetas-mysql-data:
